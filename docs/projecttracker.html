<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents for Humans Tracker</title>
<!--
  Static export of a Claude artifact, added to this repo for offline/
  version-controlled context (design docs shouldn't only live behind a
  claude.ai link that reviewers may not have access to).
  Live version: https://claude.ai/code/artifact/4a61e279-b77f-4522-8391-73b04e6461e0
  NOTE: this is a point-in-time export. The live artifact is self-updating and may have been revised since this export was made — treat this file as a snapshot for repo history, not as the current source of truth.
-->
</head>
<body>
<style id="app-style">
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper: #F5F7F6;
    --paper-raised: #FFFFFF;
    --ink: #17212B;
    --ink-soft: #52606D;
    --line: #C9D2DC;
    --line-strong: #9FB0C0;
    --blueprint: #1D5FA8;
    --blueprint-soft: #E4EDF7;
    --amber: #A85B12;
    --amber-soft: #F5E6D3;
    --teal: #2A7D68;
    --teal-soft: #DEEFEA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #0E2A4D; --paper-raised: #123765; --ink: #EAF2FA; --ink-soft: #AEC6DE;
      --line: rgba(234,242,250,0.24); --line-strong: rgba(234,242,250,0.42);
      --blueprint: #74BBF2; --blueprint-soft: rgba(116,187,242,0.16);
      --amber: #E3A45E; --amber-soft: rgba(227,164,94,0.16);
      --teal: #74D8BE; --teal-soft: rgba(116,216,190,0.16);
    }
  }
  :root[data-theme="dark"]{
    --paper: #0E2A4D; --paper-raised: #123765; --ink: #EAF2FA; --ink-soft: #AEC6DE;
    --line: rgba(234,242,250,0.24); --line-strong: rgba(234,242,250,0.42);
    --blueprint: #74BBF2; --blueprint-soft: rgba(116,187,242,0.16);
    --amber: #E3A45E; --amber-soft: rgba(227,164,94,0.16);
    --teal: #74D8BE; --teal-soft: rgba(116,216,190,0.16);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif; font-size:16px; line-height:1.55; }
  h1,h2,h3,h4{ font-family:"Archivo",ui-sans-serif,system-ui,sans-serif; text-wrap:balance; letter-spacing:-0.01em; margin:0; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,"SF Mono",monospace; }
  input, textarea, select, button{ font-family:inherit; color:inherit; }
  a{ color:var(--blueprint); }

  .sheet{ max-width: 880px; margin:0 auto; padding: 32px 20px 90px; }

  /* ---- header / hero ---- */
  .backlink{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); text-decoration:none; display:inline-block; margin-bottom:14px; }
  .backlink:hover{ color:var(--blueprint); }

  .hero{ border:1.5px solid var(--line-strong); background:var(--paper-raised); padding:26px 26px 22px; margin-bottom:28px; }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:0.12em; color:var(--blueprint); text-transform:uppercase; margin:0 0 8px; }
  .hero h1{ font-size: clamp(1.6rem, 4vw, 2.15rem); font-weight:800; margin-bottom:10px; }
  .projname{ border:none; border-bottom:1.5px dashed var(--line-strong); background:transparent; font-family:"Archivo",sans-serif; font-weight:700; font-size:1.05rem; color:var(--ink); padding:2px 0; width:100%; max-width:420px; }
  .projname::placeholder{ color:var(--ink-soft); font-weight:600; }
  .projname:focus{ outline:none; border-color:var(--blueprint); }

  .countdown{ text-align:right; }
  .countdown .cd-label{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:0.08em; color:var(--ink-soft); text-transform:uppercase; }
  .countdown .cd-num{ font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:1.7rem; color:var(--amber); font-variant-numeric:tabular-nums; }
  .countdown .cd-sub{ font-size:11px; color:var(--ink-soft); }

  .statrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border-top:1px solid var(--line); margin-top:20px; }
  .stat{ background:var(--paper-raised); padding:12px 14px; }
  .stat .n{ font-family:"IBM Plex Mono",monospace; font-size:1.3rem; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  @media (max-width:560px){ .statrow{ grid-template-columns:repeat(2,1fr); } }

  .savebar{ display:flex; align-items:center; gap:8px; margin-top:16px; font-size:12px; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); flex:none; }
  .dot.ok{ background:var(--teal); }
  .dot.busy{ background:var(--amber); }
  .dot.off{ background:var(--line-strong); }
  .banner{ background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber); padding:8px 12px; font-size:12.5px; margin-top:12px; display:none; }
  .banner.show{ display:block; }

  /* ---- sections ---- */
  section{ margin:0 0 40px; }
  .sec-tag{ display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
  .sec-tag .num{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--blueprint); border:1px solid var(--blueprint); padding:2px 7px; }
  .sec-tag h2{ font-size:1.25rem; font-weight:700; }
  .lede{ color:var(--ink-soft); font-size:0.95rem; margin:0 0 16px; max-width:64ch; }

  /* ---- idea cards ---- */
  .idea-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:760px){ .idea-grid{ grid-template-columns:1fr; } }
  .idea-card{ border:1px solid var(--line); background:var(--paper-raised); padding:14px 15px 15px; display:flex; flex-direction:column; gap:7px; cursor:pointer; transition:border-color .12s ease; }
  .idea-card:hover{ border-color:var(--line-strong); }
  .idea-card.picked{ border-color:var(--blueprint); box-shadow: inset 0 0 0 1px var(--blueprint); }
  .idea-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .idea-title{ font-weight:600; font-size:0.94rem; }
  .tag{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 7px; border-radius:999px; white-space:nowrap; flex:none; }
  .tag.everyday{ background:var(--blueprint-soft); color:var(--blueprint); }
  .tag.professional{ background:var(--teal-soft); color:var(--teal); }
  .tag.goodneighbor{ background:var(--amber-soft); color:var(--amber); }
  .idea-line{ font-size:12.5px; color:var(--ink-soft); }
  .idea-line b{ color:var(--ink); font-weight:600; }
  .idea-pick{ margin-top:4px; display:flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--blueprint); }
  .idea-pick input{ accent-color:var(--blueprint); width:14px; height:14px; }

  /* ---- concept panel ---- */
  .concept{ border:1.5px solid var(--line-strong); background:var(--paper-raised); padding:18px 20px 20px; }
  .concept-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; }
  @media (max-width:640px){ .concept-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field.full{ grid-column:1/-1; }
  .field label{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--blueprint); }
  .field input[type=text], .field select, .field textarea{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:8px 10px; font-size:13.5px; width:100%; resize:vertical;
  }
  .field textarea{ min-height:52px; font-family:"IBM Plex Sans",sans-serif; }
  .field input[type=text]:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--blueprint); }

  /* ---- checklists / phases ---- */
  .progress{ height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:6px 0 10px; }
  .progress i{ display:block; height:100%; background:var(--teal); }
  .phase{ margin-bottom:20px; }
  .phase-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .phase-head h4{ font-size:0.92rem; font-weight:600; }
  .phase-head .frac{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft); }

  .item{ display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .item input[type=checkbox]{ margin-top:3px; width:15px; height:15px; accent-color:var(--teal); flex:none; }
  .item label{ font-size:13.5px; cursor:pointer; }
  .item.done label{ color:var(--ink-soft); text-decoration:line-through; }

  .grp-title{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 6px; }
  .grp-title:first-child{ margin-top:0; }

  .notes textarea{ width:100%; min-height:100px; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); padding:12px 14px; font-size:13.5px; resize:vertical; }
  .notes textarea:focus{ outline:none; border-color:var(--blueprint); }

  footer{ border-top:1px solid var(--line); padding-top:18px; font-size:12px; color:var(--ink-soft); }
</style>

<div class="sheet">
  <a class="backlink" href="https://claude.ai/code/artifact/6175fa33-63cb-412e-8582-2e437bf54035" target="_blank" rel="noopener">&larr; Agent Systems Blueprint</a>
  <a class="backlink" href="https://claude.ai/code/artifact/2f98ad95-8fb3-43b6-a1fd-de090bf6f1e3" target="_blank" rel="noopener">&middot; Design Canvas</a>
  <a class="backlink" href="https://claude.ai/code/artifact/73ac9269-09b8-4f17-a5fb-c2b89b87aefc" target="_blank" rel="noopener">&middot; Diagrams</a>
  <div id="app"></div>
</div>

<script id="app-logic">
const STYLE_CSS = document.getElementById('app-style').textContent;
const LOGIC_SRC = document.getElementById('app-logic').textContent;

/* ---------------- helpers ---------------- */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeJSON(o){ return JSON.stringify(o).replace(/</g, '\\u003c'); }
function progressOf(items){ const done = items.filter(i => i.done).length; return { done, total: items.length, pct: items.length ? Math.round(100*done/items.length) : 0 }; }
function getPath(obj, path){ return path.split('.').reduce((o,k) => (o||{})[k], obj); }
function setPath(obj, path, val){ const parts = path.split('.'); let o = obj; for (let i=0;i<parts.length-1;i++){ o = o[parts[i]]; } o[parts[parts.length-1]] = val; }

const DEADLINE = new Date('2026-09-14T17:00:00-07:00');

/* ---------------- render: ideas ---------------- */
const TRACK_LABEL = { everyday:'Everyday', professional:'Professional', goodneighbor:'Good Neighbor' };

function ideaCard(idea, s){
  const picked = s.selectedIdeaId === idea.id;
  return `
    <div class="idea-card ${picked?'picked':''}" data-pick-idea="${idea.id}">
      <div class="idea-head">
        <span class="idea-title">${esc(idea.title)}</span>
        <span class="tag ${idea.track}">${TRACK_LABEL[idea.track]}</span>
      </div>
      <div class="idea-line"><b>Stock —</b> ${esc(idea.stock)}</div>
      <div class="idea-line"><b>Broken loop —</b> ${esc(idea.brokenLoop)}</div>
      <div class="idea-line"><b>Leverage —</b> ${esc(idea.leverage)}</div>
      <label class="idea-pick"><input type="radio" name="idea" value="${idea.id}" ${picked?'checked':''} data-pick-idea="${idea.id}"> ${picked?'This is our idea':'Pick this one'}</label>
    </div>`;
}

/* ---------------- render: checklist item ---------------- */
function itemRow(item){
  return `
    <div class="item ${item.done?'done':''}">
      <input type="checkbox" id="chk-${item.id}" data-toggle="${item.id}" ${item.done?'checked':''}>
      <label for="chk-${item.id}">${esc(item.label)}</label>
    </div>`;
}

/* ---------------- full app render ---------------- */
function appHTML(s){
  const now = progressOf(s.checklist.filter(c => c.group==='now'));
  const req = progressOf(s.checklist.filter(c => c.group==='required'));
  const bonus = progressOf(s.checklist.filter(c => c.group==='bonus'));
  const phases = progressOf(s.tasks);

  const phaseNames = [...new Set(s.tasks.map(t => t.phase))];

  return `
    <header class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Agents for Humans &middot; Build Tracker</p>
          <h1>Project Tracker</h1>
          <input class="projname" data-field="project.name" value="${esc(s.project.name)}" placeholder="Name this project&hellip;">
        </div>
        <div class="countdown">
          <div class="cd-label">Submission closes</div>
          <div class="cd-num" id="cdnum">&mdash;</div>
          <div class="cd-sub">Sep 14, 2026 &middot; 5:00pm PT</div>
        </div>
      </div>
      <div class="statrow">
        <div class="stat"><div class="n">${now.done}/${now.total}</div><div class="l">Do now</div></div>
        <div class="stat"><div class="n">${req.done}/${req.total}</div><div class="l">Required</div></div>
        <div class="stat"><div class="n">${bonus.done}/${bonus.total}</div><div class="l">Bonus</div></div>
        <div class="stat"><div class="n">${phases.done}/${phases.total}</div><div class="l">Build tasks</div></div>
      </div>
      <div class="banner ${s.readOnlyBanner?'show':''}" id="banner">${esc(s.bannerText||'')}</div>
      <div class="savebar"><span class="dot ${s.saveState}" id="savedot"></span><span id="savetext">${esc(s.saveText||'')}</span></div>
    </header>

    <section id="ideas-sec">
      <div class="sec-tag"><span class="num">01</span><h2>Idea shortlist</h2></div>
      <p class="lede">Nine starting concepts, three per track, each with the stock, the broken loop, and the leverage point behind it. Pick one to seed the concept snapshot below &mdash; you can still edit everything after.</p>
      <div class="idea-grid">
        ${s.ideas.map(i => ideaCard(i, s)).join('')}
      </div>
    </section>

    <section id="concept-sec">
      <div class="sec-tag"><span class="num">02</span><h2>Concept snapshot</h2></div>
      <p class="lede">Your filled-in canvas. This is what turns into your submission's text description and architecture diagram.</p>
      <div class="concept">
        <div class="concept-grid">
          <div class="field">
            <label>Track</label>
            <select data-field="concept.track">
              <option value="" ${!s.concept.track?'selected':''}>&mdash; choose &mdash;</option>
              <option value="everyday" ${s.concept.track==='everyday'?'selected':''}>Everyday</option>
              <option value="professional" ${s.concept.track==='professional'?'selected':''}>Professional</option>
              <option value="goodneighbor" ${s.concept.track==='goodneighbor'?'selected':''}>Good Neighbor</option>
            </select>
          </div>
          <div class="field">
            <label>Topology</label>
            <select data-field="concept.topology">
              <option value="" ${!s.concept.topology?'selected':''}>&mdash; choose &mdash;</option>
              <option value="Workflow" ${s.concept.topology==='Workflow'?'selected':''}>Workflow (DAG)</option>
              <option value="Graph" ${s.concept.topology==='Graph'?'selected':''}>Graph</option>
              <option value="Swarm" ${s.concept.topology==='Swarm'?'selected':''}>Swarm</option>
              <option value="Agents-as-tools" ${s.concept.topology==='Agents-as-tools'?'selected':''}>Agents-as-tools</option>
            </select>
          </div>
          <div class="field full">
            <label>One-liner</label>
            <input type="text" data-field="concept.oneLiner" value="${esc(s.concept.oneLiner)}" placeholder="What it does, for whom, in one sentence">
          </div>
          <div class="field">
            <label>Stock</label>
            <input type="text" data-field="concept.stock" value="${esc(s.concept.stock)}" placeholder="The level that's building up or draining">
          </div>
          <div class="field">
            <label>Leverage point</label>
            <input type="text" data-field="concept.leverage" value="${esc(s.concept.leverage)}" placeholder="Rung # and why">
          </div>
          <div class="field full">
            <label>Broken loop</label>
            <textarea data-field="concept.brokenLoop" placeholder="X should notice Y and respond, but currently doesn't because Z">${esc(s.concept.brokenLoop)}</textarea>
          </div>
          <div class="field">
            <label>Goal metric</label>
            <input type="text" data-field="concept.goal" value="${esc(s.concept.goal)}" placeholder="The number you'll show moving in the demo">
          </div>
          <div class="field">
            <label>Archetype risk</label>
            <input type="text" data-field="concept.risk" value="${esc(s.concept.risk)}" placeholder="Which failure pattern is most likely">
          </div>
          <div class="field full">
            <label>Guardrails</label>
            <textarea data-field="concept.guardrails" placeholder="Tools, permissions, policy limits">${esc(s.concept.guardrails)}</textarea>
          </div>
        </div>
      </div>
    </section>

    <section id="phases-sec">
      <div class="sec-tag"><span class="num">03</span><h2>Build tasks</h2></div>
      <p class="lede">The nine-step process, broken into checkable work. ${phases.done}/${phases.total} done.</p>
      <div class="progress"><i style="width:${phases.pct}%"></i></div>
      ${phaseNames.map(p => {
        const items = s.tasks.filter(t => t.phase === p);
        const pr = progressOf(items);
        return `
          <div class="phase">
            <div class="phase-head"><h4>${esc(p)}</h4><span class="frac mono">${pr.done}/${pr.total}</span></div>
            <div class="progress"><i style="width:${pr.pct}%"></i></div>
            ${items.map(itemRow).join('')}
          </div>`;
      }).join('')}
    </section>

    <section id="checklist-sec">
      <div class="sec-tag"><span class="num">04</span><h2>Submission checklist</h2></div>
      <p class="lede">Straight from the devpost requirements &mdash; nothing added, nothing renamed.</p>

      <div class="grp-title">Do right now</div>
      ${s.checklist.filter(c=>c.group==='now').map(itemRow).join('')}

      <div class="grp-title">Required to submit</div>
      ${s.checklist.filter(c=>c.group==='required').map(itemRow).join('')}

      <div class="grp-title">Bonus (optional)</div>
      ${s.checklist.filter(c=>c.group==='bonus').map(itemRow).join('')}
    </section>

    <section id="notes-sec">
      <div class="sec-tag"><span class="num">05</span><h2>Notes &amp; parking lot</h2></div>
      <div class="notes"><textarea data-field="notes" placeholder="Open questions, risks, teammate assignments, anything you don't want to lose&hellip;">${esc(s.notes)}</textarea></div>
    </section>

    <footer>
      Tracks the requirements posted at agentsforhumans.devpost.com as of Aug 25, 2026. Deadline: Sep 14, 2026, 5:00pm PT. Re-check the Rules page before you submit &mdash; hackathon terms can change.
    </footer>
  `;
}

/* ---------------- boot / state / persistence ---------------- */
let state = null;
let artifactCap = null;
let readOnly = false;
let saveTimer = null;

function render(){
  document.getElementById('app').innerHTML = appHTML(state);
  tickCountdown();
}

function setSave(kind, text){
  state.saveState = kind;
  state.saveText = text;
  const dot = document.getElementById('savedot');
  const txt = document.getElementById('savetext');
  if (dot){ dot.className = 'dot ' + kind; }
  if (txt){ txt.textContent = text; }
}

function setBanner(text){
  state.readOnlyBanner = !!text;
  state.bannerText = text || '';
  const b = document.getElementById('banner');
  if (b){ b.textContent = text || ''; b.className = 'banner ' + (text ? 'show' : ''); }
}

function tickCountdown(){
  const el = document.getElementById('cdnum');
  if (!el) return;
  const ms = DEADLINE - new Date();
  if (ms <= 0){ el.textContent = 'Closed'; return; }
  const d = Math.floor(ms/86400000);
  const h = Math.floor((ms%86400000)/3600000);
  const m = Math.floor((ms%3600000)/60000);
  el.textContent = d + 'd ' + h + 'h ' + m + 'm';
}
setInterval(tickCountdown, 30000);

function schedulePersist(){
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doPersist, 500);
}

async function doPersist(){
  if (readOnly){ setSave('off', "Read-only view — changes aren't saved here"); return; }
  if (!artifactCap){ setSave('off', 'Not connected — changes stay on this device only'); return; }
  setSave('busy', 'Saving…');
  try{
    await artifactCap.publish(buildFullDocument(state));
    setSave('ok', 'Saved');
  }catch(err){
    const code = err && err.code;
    if (code === 'conflict'){ setSave('busy', 'Updated elsewhere — reloading…'); return; }
    if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'){
      readOnly = true; setBanner("This view can't save changes — they'll only last until you close the tab.");
      setSave('off', 'Read-only view'); return;
    }
    setSave('off', 'Save failed — will retry on next change');
  }
}

function buildFullDocument(s){
  const clean = { ...s };
  delete clean.saveState; delete clean.saveText; delete clean.readOnlyBanner; delete clean.bannerText;
  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents for Humans Tracker</title>
<style id="app-style">${STYLE_CSS}</style>
</head>
<body>
<div class="sheet">
  <a class="backlink" href="https://claude.ai/code/artifact/6175fa33-63cb-412e-8582-2e437bf54035" target="_blank" rel="noopener">&larr; Agent Systems Blueprint</a>
  <a class="backlink" href="https://claude.ai/code/artifact/2f98ad95-8fb3-43b6-a1fd-de090bf6f1e3" target="_blank" rel="noopener">&middot; Design Canvas</a>
  <a class="backlink" href="https://claude.ai/code/artifact/73ac9269-09b8-4f17-a5fb-c2b89b87aefc" target="_blank" rel="noopener">&middot; Diagrams</a>
  <div id="app"></div>
</div>
<script id="app-logic">${LOGIC_SRC}<\/script>

/* ---------------- event delegation ---------------- */
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.toggle){
    const item = state.checklist.find(i => i.id === t.dataset.toggle) || state.tasks.find(i => i.id === t.dataset.toggle);
    if (item){ item.done = t.checked; render(); schedulePersist(); }
    return;
  }
  if (t.dataset.pickIdea !== undefined){
    const idea = state.ideas.find(i => i.id === t.dataset.pickIdea);
    if (idea){
      state.selectedIdeaId = idea.id;
      state.concept.track = idea.track;
      state.concept.oneLiner = idea.concept;
      state.concept.stock = idea.stock;
      state.concept.brokenLoop = idea.brokenLoop;
      state.concept.leverage = idea.leverage;
      state.concept.topology = idea.topology;
      render(); schedulePersist();
    }
    return;
  }
  if (t.dataset.field){
    setPath(state, t.dataset.field, t.value);
    if (t.tagName === 'SELECT'){ render(); }
    schedulePersist();
  }
});

document.addEventListener('click', (e) => {
  const card = e.target.closest('[data-pick-idea]');
  if (card && e.target.tagName !== 'INPUT'){
    const id = card.getAttribute('data-pick-idea');
    const radio = document.querySelector(`input[data-pick-idea="${id}"]`);
    if (radio && !radio.checked){ radio.checked = true; radio.dispatchEvent(new Event('change', {bubbles:true})); }
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.field && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')){
    setPath(state, t.dataset.field, t.value);
  }
});

document.addEventListener('focusout', (e) => {
  if (e.target.dataset && e.target.dataset.field){ schedulePersist(); }
});

async function boot(initial){
  state = initial;
  render();
  if (window.claude && typeof window.claude.use === 'function'){
    try{
      artifactCap = await window.claude.use('artifact');
      if (!artifactCap){ setSave('off', 'Not connected — changes stay on this device only'); }
      else { setSave('ok', 'Ready'); }
    }catch(e){ setSave('off', 'Not connected — changes stay on this device only'); }
  } else {
    setSave('off', 'Not connected — changes stay on this device only');
  }
}
</script>

ile route has fixed stop capacity, so always favoring the single highest-need tract can starve a tract it already serves) — mitigated by requiring that trade-off to be disclosed in the output itself, not just implied.', guardrails:'Cite the dataset and its vintage year on every answer. Refuse regions outside the indexed pilot city/county rather than guess — enforced in code (neither Advisor accepts a region argument), not just prompted. Frame every output as decision support, never a decision. Rural adds: disclose the route-capacity trade-off explicitly rather than only ever sounding additive. No PII involved — public, tract- or resource-level data only.' },

e sent, strands-agents installed and test-verified in-session (pytest 4/4 passing), Agent() builds with all 4 tools registered. Still needed: real LRAM download run through prep_atlas.py (sample data in place now), AWS Bedrock credentials to actually invoke it.\nNext: GTFS transit-time distance (biggest single differentiator over the source data).\nThen: Watchdog agent (the accountability story).\nCut first if time is short: ML trend-forecasting layer — real academic precedent exists already, so it’s the least differentiated for the effort.\n\nOPEN ITEMS (8/26, after Step 9 + canvas + diagrams): (1) Overpass silent-failure logging — existing_resources.py currently swallows an OSM query failure into an empty list with just a print(); the Step 9 pre-mortem flagged this should become a real observability signal instead of a silent one. Not yet fixed. (2) Watchdog agent — still not scaffolded; it’s the next real build step per the MVP-then-stretch order, and the diagram set already marks it clearly as “planned, not yet in the repo” rather than overclaiming it exists. Also done since the last note: the 12-cell design canvas (§07) and three diagrams — the pure systems-thinking causal-loop diagram, the Strands agent architecture (Advisor solid/built, Watchdog dashed/planned), and an AWS system architecture diagram drawn with the `diagrams` Python package — all published as their own artifacts and linked from this tracker.\n\nRURAL ANGLE ADDED (8/26): elevated to a THREE-agent, two-region system after a full steps 1–9 systems-thinking pass on rural specifically — deliberately checked whether it was really “the same loop, wider miles” before assuming so, and it wasn’t. Rural’s broken loop is different in kind: mobile markets and food-bank routes already exist, but get planned once and rarely re-optimized against current need — a coordination gap, not an information vacuum like urban’s. New sibling agent: Route Advisor — same shape as the original Advisor (one Agent, tools in ce, confirmed on the OSM wiki), just thinner rural coverage than urban. The Farmers Market API is a stretch enhancement pending an actual registered-key test, not a blocking dependency.\n\nCanvas (§07) updated 8/26 to reflect three agents across two regions — Boundary, Stocks, Flows, Existing loop, Leverage point, Goal state, Loop design, Topology, Memory, Guardrails, Success metric, and Archetype risk cells are now all agent-tagged (Site Advisor / Route Advisor / Watchdog).\n\nNot yet done: Route Advisor has no code yet — design only, same status as Watchdog. The rural pilot county itself still isn’t picked (Topeka and Kansas City were floated early on as options for the whole project, never decided either way).',
